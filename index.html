<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPG Mod Studio AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,-apple-system,sans-serif; }
    body {
      background: #0a0e1a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(79,134,247,0.3); border-radius: 4px; }

    .top-bar {
      height: 56px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      z-index: 10;
    }
    .top-bar .brand {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #4f86f7, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-bar .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .top-bar .actions button {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #8a9bb5;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar .actions button:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .top-bar .actions button.primary {
      background: linear-gradient(135deg, #4f86f7, #2563eb);
      color: #fff;
      border: none;
    }
    .top-bar .actions button.primary:hover { box-shadow: 0 0 20px rgba(79,134,247,0.4); }

    .model-selector { position: relative; display: inline-block; }
    .model-selector .selected {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 5px 14px;
      border-radius: 8px;
      color: #c8d0e0;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-selector .dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 220px;
      background: rgba(24,28,40,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      gap: 2px;
      z-index: 20;
    }
    .model-selector .dropdown.open { display: flex; }
    .model-selector .dropdown .opt {
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .model-selector .dropdown .opt:hover { background: rgba(255,255,255,0.06); }
    .model-selector .dropdown .opt.selected {
      background: rgba(79,134,247,0.12);
      border: 1px solid rgba(79,134,247,0.2);
      color: #6e8ff7;
    }

    .switch-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #8a9bb5;
      cursor: pointer;
      user-select: none;
    }
    .switch-label input[type="checkbox"] {
      appearance: none;
      width: 32px;
      height: 18px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .switch-label input[type="checkbox"]:checked {
      background: rgba(79,134,247,0.4);
      border-color: rgba(79,134,247,0.3);
    }
    .switch-label input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .switch-label input[type="checkbox"]:checked::after {
      left: 16px;
      background: #fff;
    }

    .main-layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 260px;
      background: rgba(24,28,40,0.6);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar .header {
      font-size: 11px;
      font-weight: 700;
      color: #4a5a7a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar .header button {
      background: none;
      border: none;
      color: #4a5a7a;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .sidebar .header button:hover { color: #ef4444; }
    .file-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .file-item {
      padding: 6px 10px;
      border-radius: 8px;
      color: #7a8aa8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
      font-size: 13px;
      font-family: 'Consolas', monospace;
    }
    .file-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
    .file-item.active {
      background: rgba(79,134,247,0.08);
      border-left: 2px solid #4f86f7;
      color: #fff;
    }
    .file-item .del {
      color: #ef4444;
      opacity: 0;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }
    .file-item:hover .del { opacity: 0.6; }
    .file-item .del:hover { opacity: 1; }
    .file-empty {
      color: #3a4a6a;
      font-size: 12px;
      text-align: center;
      margin-top: 30px;
      font-style: italic;
    }

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(15,18,26,0.4);
      min-width: 0;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }
    .msg .author {
      font-size: 11px;
      font-weight: 700;
      color: #4a5a7a;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .msg .bubble {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: rgba(79,134,247,0.1);
      border: 1px solid rgba(79,134,247,0.15);
      padding: 12px 16px;
      border-radius: 14px 14px 4px 14px;
      color: #f0f3ff;
      align-self: flex-end;
      max-width: 85%;
    }
    .msg.assistant .bubble {
      color: #e2e8f0;
      max-width: 100%;
    }
    .msg.assistant .bubble.think-plan {
      background: rgba(52,211,153,0.06);
      border-left: 3px solid #6ee7b7;
      padding: 10px 14px;
      border-radius: 8px;
      color: #c8d0e0;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .msg .logs {
      background: rgba(52,211,153,0.05);
      border: 1px solid rgba(52,211,153,0.1);
      color: #6ee7b7;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Consolas', monospace;
      margin-top: 6px;
    }

    .input-area {
      padding: 12px 24px 20px;
      background: linear-gradient(to top, rgba(15,18,26,0.95), transparent);
      flex-shrink: 0;
    }
    .input-wrapper {
      max-width: 820px;
      margin: 0 auto;
      background: rgba(24,28,40,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.3s;
    }
    .input-wrapper:focus-within {
      border-color: rgba(79,134,247,0.2);
      box-shadow: 0 0 40px rgba(79,134,247,0.03);
    }
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .input-row textarea {
      flex: 1;
      background: none;
      border: none;
      color: #f0f3ff;
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 24px;
      max-height: 160px;
      line-height: 1.6;
      font-family: inherit;
    }
    .input-row textarea::placeholder { color: #3a4a6a; }
    .input-row button {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      color: #8a9bb5;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: 0.2s;
    }
    .input-row button:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .input-row button.send {
      background: linear-gradient(135deg, #4f86f7, #2563eb);
      border: none;
      color: #fff;
    }
    .input-row button.send:hover { box-shadow: 0 0 20px rgba(79,134,247,0.4); transform: translateY(-2px); }

    .preview-panel {
      width: 0;
      overflow: hidden;
      background: rgba(24,28,40,0.4);
      backdrop-filter: blur(8px);
      border-left: 1px solid rgba(255,255,255,0.04);
      transition: width 0.3s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .preview-panel.open { width: 380px; padding: 16px; }
    .preview-panel .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .preview-panel .preview-header span {
      font-size: 13px;
      font-weight: 600;
      color: #c8d0e0;
    }
    .preview-panel .preview-header button {
      background: none;
      border: none;
      color: #4a5a7a;
      cursor: pointer;
      font-size: 16px;
    }
    .preview-panel .preview-content {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      color: #c8d0e0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(24,28,40,0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 440px;
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(20px) scale(0.96); }
      to { opacity:1; transform:translateY(0) scale(1); }
    }
    .modal h3 { font-size:18px; margin-bottom:16px; color:#fff; }
    .modal label {
      font-size:11px; color:#4a5a7a; display:block; margin-top:14px; margin-bottom:5px;
      text-transform:uppercase; letter-spacing:0.5px;
    }
    .modal input {
      width:100%; padding:10px 14px; background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.06); border-radius:10px;
      color:#f0f3ff; outline:none; font-size:13px;
    }
    .modal input:focus { border-color:rgba(79,134,247,0.2); }
    .modal-actions { display:flex; gap:10px; margin-top:24px; }
    .modal-actions button {
      flex:1; padding:10px; border:none; border-radius:10px; cursor:pointer;
      font-weight:600; font-size:13px; transition:0.2s;
    }
    .modal-actions .save-btn { background:linear-gradient(135deg,#4f86f7,#2563eb); color:#fff; }
    .modal-actions .save-btn:hover { box-shadow:0 0 20px rgba(79,134,247,0.3); }
    .modal-actions .cancel-btn { background:rgba(255,255,255,0.04); color:#8a9bb5; }
    .modal-actions .cancel-btn:hover { background:rgba(255,255,255,0.08); }
  </style>
</head>
<body>

<div class="top-bar">
  <span class="brand">🛠 PPG Mod Studio</span>
  <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    <div class="model-selector" id="modelSelector">
      <div class="selected" id="modelSelectBtn">
        <span id="currentModelLabel">gemini-2.5-flash</span> ▾
      </div>
      <div class="dropdown" id="modelDropdown">
        <div class="opt selected" data-model="gemini-2.5-flash">gemini-2.5-flash</div>
        <div class="opt" data-model="gemini-2.5-pro">gemini-2.5-pro</div>
        <div class="opt" data-model="custom">Кастомная модель</div>
      </div>
    </div>
    <label class="switch-label">
      <input type="checkbox" id="thinkMode" /> 🧠 Think
    </label>
    <div class="actions">
      <button class="primary" id="zipBtn">📦 ZIP</button>
      <button id="settingsBtn">⚙</button>
      <button id="clearBtn" style="color:#ef4444;">🗑</button>
    </div>
  </div>
</div>

<div class="main-layout">
  <div class="sidebar">
    <div class="header">
      <span>📁 Файлы мода</span>
      <button id="deleteAllFiles" title="Удалить все файлы">✕</button>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <div class="input-row">
          <button id="attachBtn">📎</button>
          <input type="file" id="fileInput" style="display:none;" />
          <textarea id="inputBox" placeholder="Опишите механику мода... (Ctrl+Enter)"></textarea>
          <button class="send" id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <div class="preview-panel" id="previewPanel">
    <div class="preview-header">
      <span id="previewFileName">file.cs</span>
      <button id="closePreview">✕</button>
    </div>
    <div class="preview-content" id="previewContent">(выберите файл)</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>⚙ Настройки API</h3>
    <label>API Key</label>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy... или sk-..." />
    <label>Base URL (пусто для Gemini)</label>
    <input type="text" id="baseUrlInput" placeholder="https://openrouter.ai/api/v1" />
    <label>Кастомная модель</label>
    <input type="text" id="customModelInput" placeholder="google/gemini-2.0-flash-exp:free" />
    <div class="modal-actions">
      <button class="cancel-btn" id="closeModalBtn">Отмена</button>
      <button class="save-btn" id="saveSettingsBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function() {
  // --- DOM refs ---
  const messagesEl = document.getElementById('messages');
  const inputBox = document.getElementById('inputBox');
  const sendBtn = document.getElementById('sendBtn');
  const fileList = document.getElementById('fileList');
  const previewPanel = document.getElementById('previewPanel');
  const previewContent = document.getElementById('previewContent');
  const previewFileName = document.getElementById('previewFileName');
  const closePreview = document.getElementById('closePreview');
  const zipBtn = document.getElementById('zipBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const clearBtn = document.getElementById('clearBtn');
  const deleteAllFilesBtn = document.getElementById('deleteAllFiles');
  const modalOverlay = document.getElementById('modalOverlay');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const baseUrlInput = document.getElementById('baseUrlInput');
  const customModelInput = document.getElementById('customModelInput');
  const modelSelectBtn = document.getElementById('modelSelectBtn');
  const modelDropdown = document.getElementById('modelDropdown');
  const currentModelLabel = document.getElementById('currentModelLabel');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const thinkModeCheckbox = document.getElementById('thinkMode');

  // --- State ---
  let apiKey = localStorage.getItem('app_api_key') || '';
  let baseUrl = localStorage.getItem('app_base_url') || '';
  let selectedModel = localStorage.getItem('app_model') || 'gemini-2.5-flash';
  let customModel = localStorage.getItem('app_custom_model') || '';
  let messages = JSON.parse(localStorage.getItem('app_messages') || '[]');
  let fs = JSON.parse(localStorage.getItem('app_fs') || '{}');
  let isWaiting = false;
  let activeAttachment = null;
  let selectedFilePath = null;

  // --- System Instruction (обновлённый) ---
  function getSystemInstruction(thinkMode) {
    let base = `Ты — эксперт C# разработчик модов для People Playground.
Твоя задача — создавать рабочий код C# скриптов и манифест mod.json.

ПРАВИЛА ОТВЕТА (ОЧЕНЬ ВАЖНО):
1. ОТВЕЧАЙ ТОЛЬКО VFS-БЛОКАМИ с кодом.
2. НЕ ПИШИ никаких описаний, списков, заголовков, жирного текста, эмодзи.
3. НЕ ОБЪЯСНЯЙ код — он говорит сам за себя.
4. Если нужно что-то пояснить — напиши ОДНУ КОРОТКУЮ СТРОКУ и сразу VFS-блоки.
5. ЗАПРЕЩЕНО использовать: ###, **, *, -, 📦, и т.п.

Формат VFS:
\`\`\`vfs
WRITE /mod.json
{ "Name": "My Mod", "Author": "User" }
\`\`\`
или
\`\`\`vfs
DELETE /file.cs
\`\`\``;

    if (thinkMode) {
      base += `

ДОПОЛНИТЕЛЬНО: Перед тем как писать VFS-блоки, покажи КРАТКИЙ ПЛАН действий в виде маркированного списка (используй символ "-" для каждого пункта). План должен быть не более 5 пунктов. Например:
- Создаю файл Main.cs с базовой структурой
- Добавляю логику обновления
- Создаю mod.json

После плана сразу идут VFS-блоки.`;
    }
    return base;
  }

  // --- Helpers ---
  function saveFs() {
    localStorage.setItem('app_fs', JSON.stringify(fs));
    renderFileList();
  }
  function saveMessages() {
    localStorage.setItem('app_messages', JSON.stringify(messages));
  }

  function getFlatFiles(obj, path = '') {
    let res = [];
    for (let k in obj) {
      let p = path ? path + '/' + k : k;
      if (typeof obj[k] === 'string') res.push({ path: '/' + p, content: obj[k] });
      else res.push(...getFlatFiles(obj[k], p));
    }
    return res;
  }

  function setFile(path, content) {
    let parts = path.replace(/^\/+/, '').split('/');
    let curr = fs;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!curr[parts[i]] || typeof curr[parts[i]] !== 'object') curr[parts[i]] = {};
      curr = curr[parts[i]];
    }
    curr[parts[parts.length - 1]] = content;
    saveFs();
  }

  function deleteFile(path) {
    let parts = path.replace(/^\/+/, '').split('/');
    let curr = fs;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!curr[parts[i]]) return;
      curr = curr[parts[i]];
    }
    delete curr[parts[parts.length - 1]];
    saveFs();
  }

  function deleteAllFiles() {
    fs = {};
    saveFs();
    closePreviewPanel();
  }

  function renderFileList() {
    const files = getFlatFiles(fs);
    fileList.innerHTML = '';
    if (!files.length) {
      fileList.innerHTML = '<div class="file-empty">Нет файлов</div>';
      return;
    }
    files.forEach(f => {
      const div = document.createElement('div');
      div.className = 'file-item' + (f.path === selectedFilePath ? ' active' : '');
      const icon = f.path.endsWith('.cs') ? '📜' : (f.path.endsWith('.json') ? '⚙️' : '📄');
      div.innerHTML = `<span>${icon} ${f.path}</span><span class="del" data-path="${f.path}">✕</span>`;
      div.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) return;
        openPreview(f.path, f.content);
      });
      div.querySelector('.del').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteFile(f.path);
        if (selectedFilePath === f.path) closePreviewPanel();
      });
      fileList.appendChild(div);
    });
  }

  function openPreview(path, content) {
    selectedFilePath = path;
    previewFileName.textContent = path;
    previewContent.textContent = content || '(пусто)';
    previewPanel.classList.add('open');
    renderFileList();
  }

  function closePreviewPanel() {
    selectedFilePath = null;
    previewPanel.classList.remove('open');
    renderFileList();
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.role;
      const auth = document.createElement('div');
      auth.className = 'author';
      auth.textContent = m.role === 'user' ? 'Вы' : 'PPG Assistant';
      div.appendChild(auth);
      if (m.image) {
        const img = document.createElement('img');
        img.src = m.image;
        img.style.maxWidth = '280px';
        img.style.maxHeight = '200px';
        img.style.borderRadius = '8px';
        img.style.marginTop = '6px';
        div.appendChild(img);
      }
      if (m.content) {
        const bub = document.createElement('div');
        bub.className = 'bubble';
        if (m.role === 'assistant' && m.isPlan) {
          bub.classList.add('think-plan');
        }
        bub.textContent = m.content;
        div.appendChild(bub);
      }
      if (m.logs && m.logs.length) {
        const logsDiv = document.createElement('div');
        logsDiv.className = 'logs';
        m.logs.forEach(l => {
          const line = document.createElement('div');
          line.textContent = l;
          logsDiv.appendChild(line);
        });
        div.appendChild(logsDiv);
      }
      messagesEl.appendChild(div);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, content, logs = [], image = null, isPlan = false) {
    messages.push({ role, content, logs, image, isPlan });
    saveMessages();
    renderMessages();
  }

  function parseVFSCommands(text) {
    const regex = /```vfs\s*\n([\s\S]*?)\n```/g;
    let match;
    const logs = [];
    let clean = text.replace(regex, '').trim();
    while ((match = regex.exec(text)) !== null) {
      const block = match[1].trim();
      const lines = block.split('\n');
      const cmd = lines[0].trim();
      if (cmd.startsWith('WRITE ')) {
        const path = cmd.replace('WRITE ', '').trim();
        const content = lines.slice(1).join('\n');
        setFile(path, content);
        logs.push('⚙️ Сохранён: ' + path);
      } else if (cmd.startsWith('DELETE ')) {
        const path = cmd.replace('DELETE ', '').trim();
        deleteFile(path);
        logs.push('🗑 Удалён: ' + path);
      }
    }
    return { cleanText: clean, logs };
  }

  // --- Send ---
  async function handleSend() {
    const text = inputBox.value.trim();
    if ((!text && !activeAttachment) || isWaiting) return;
    if (!apiKey) {
      alert('Укажите API Key в настройках!');
      modalOverlay.classList.add('open');
      return;
    }

    let imgData = activeAttachment?.type === 'image' ? activeAttachment : null;
    let fullPrompt = text;
    if (activeAttachment?.type === 'text') {
      fullPrompt += '\n\n[Файл ' + activeAttachment.name + ']:\n' + activeAttachment.content;
    }
    activeAttachment = null;
    inputBox.value = '';
    inputBox.style.height = 'auto';

    addMessage('user', text, [], imgData?.dataUrl || null);
    isWaiting = true;

    try {
      const files = getFlatFiles(fs);
      const fsContext = '[Текущие файлы мода]:\n' + (files.map(f => f.path).join('\n') || '(пусто)');
      const targetModel = (selectedModel === 'custom') ? customModel : selectedModel;
      if (!targetModel) throw new Error('Укажите модель в настройках.');

      const thinkMode = thinkModeCheckbox.checked;
      const systemInstruction = getSystemInstruction(thinkMode);

      let rawAnswer = '';
      const isCustomProxy = baseUrl.trim() && !baseUrl.includes('generativelanguage.googleapis.com');

      if (!isCustomProxy) {
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + targetModel + ':generateContent?key=' + apiKey;
        const contents = messages.filter(m => m.role !== 'system').map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content || ' ' }]
        }));
        const currentParts = [{ text: fsContext + '\n\nЗадача: ' + fullPrompt }];
        if (imgData) {
          currentParts.unshift({ inlineData: { mimeType: imgData.mimeType, data: imgData.base64 } });
        }
        contents[contents.length - 1].parts = currentParts;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents
          })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || 'HTTP ' + res.status);
        }
        const data = await res.json();
        rawAnswer = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      } else {
        const endpoint = baseUrl.replace(/\/+$/, '') + '/chat/completions';
        const formatted = [
          { role: 'system', content: systemInstruction + '\n\n' + fsContext },
          ...messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content || '' }))
        ];
        formatted[formatted.length - 1].content = fsContext + '\n\nЗадача: ' + fullPrompt;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({ model: targetModel, messages: formatted })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || 'HTTP ' + res.status);
        }
        const data = await res.json();
        rawAnswer = data.choices?.[0]?.message?.content || '';
      }

      // Извлекаем план, если есть
      let planText = '';
      let codeText = rawAnswer;
      if (thinkMode) {
        // Ищем план в формате "- пункт" в начале ответа
        const lines = rawAnswer.split('\n');
        let planLines = [];
        let i = 0;
        while (i < lines.length && (lines[i].trim().startsWith('-') || lines[i].trim() === '')) {
          if (lines[i].trim().startsWith('-')) {
            planLines.push(lines[i].trim());
          }
          i++;
        }
        if (planLines.length > 0) {
          planText = planLines.join('\n');
          codeText = lines.slice(i).join('\n').trim();
        }
      }

      const { cleanText, logs } = parseVFSCommands(codeText);
      // Если есть план, показываем его как отдельное сообщение с пометкой isPlan
      if (planText) {
        addMessage('assistant', planText, [], null, true);
      }
      addMessage('assistant', cleanText || 'Готово.', logs);
    } catch (e) {
      addMessage('assistant', '❌ Ошибка: ' + e.message);
    } finally {
      isWaiting = false;
    }
  }

  // --- Attach ---
  attachBtn.onclick = function() { fileInput.click(); };
  fileInput.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = function(ev) {
        activeAttachment = {
          type: 'image',
          mimeType: file.type,
          dataUrl: ev.target.result,
          base64: ev.target.result.split(',')[1]
        };
        inputBox.placeholder = '📎 ' + file.name + ' (изображение)';
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = function(ev) {
        activeAttachment = { type: 'text', name: file.name, content: ev.target.result };
        inputBox.placeholder = '📎 ' + file.name + ' (текст)';
      };
      reader.readAsText(file);
    }
    fileInput.value = '';
  };

  // --- Events ---
  sendBtn.onclick = handleSend;
  inputBox.onkeydown = function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleSend();
    }
  };

  modelSelectBtn.onclick = function() {
    modelDropdown.classList.toggle('open');
  };
  modelDropdown.onclick = function(e) {
    const opt = e.target.closest('.opt');
    if (!opt) return;
    selectedModel = opt.dataset.model;
    localStorage.setItem('app_model', selectedModel);
    currentModelLabel.textContent = (selectedModel === 'custom' && customModel) ? customModel : opt.textContent.trim();
    document.querySelectorAll('.opt').forEach(o => o.classList.toggle('selected', o === opt));
    modelDropdown.classList.remove('open');
  };

  settingsBtn.onclick = function() {
    apiKeyInput.value = apiKey;
    baseUrlInput.value = baseUrl;
    customModelInput.value = customModel;
    modalOverlay.classList.add('open');
  };
  closeModalBtn.onclick = function() { modalOverlay.classList.remove('open'); };
  saveSettingsBtn.onclick = function() {
    apiKey = apiKeyInput.value.trim();
    baseUrl = baseUrlInput.value.trim();
    customModel = customModelInput.value.trim();
    localStorage.setItem('app_api_key', apiKey);
    localStorage.setItem('app_base_url', baseUrl);
    localStorage.setItem('app_custom_model', customModel);
    if (selectedModel === 'custom') {
      currentModelLabel.textContent = customModel || 'custom';
    }
    modalOverlay.classList.remove('open');
  };

  zipBtn.onclick = async function() {
    const files = getFlatFiles(fs);
    if (!files.length) {
      alert('Нет файлов для архива');
      return;
    }
    try {
      const zip = new JSZip();
      files.forEach(f => zip.file(f.path.replace(/^\//, ''), f.content));
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'PPG_Mod.zip';
      a.click();
    } catch(e) {
      alert('Ошибка создания ZIP: ' + e.message);
    }
  };

  clearBtn.onclick = function() {
    if (confirm('Очистить историю чата?')) {
      messages = [];
      saveMessages();
      renderMessages();
    }
  };
  deleteAllFilesBtn.onclick = function() {
    if (confirm('Удалить все файлы мода?')) {
      deleteAllFiles();
    }
  };

  closePreview.onclick = closePreviewPanel;

  // --- Init ---
  function init() {
    renderMessages();
    renderFileList();
    document.querySelectorAll('.opt').forEach(o => {
      if (o.dataset.model === selectedModel) {
        o.classList.add('selected');
        currentModelLabel.textContent = (selectedModel === 'custom' && customModel) ? customModel : o.textContent.trim();
      }
    });
    closePreviewPanel();
    console.log('PPG Mod Studio AI готов!');
  }
  init();
})();
</script>
</body>
</html>
