<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPG Mod Studio AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',system-ui,-apple-system,sans-serif; }
    body { background:#0f121a; color:#e2e8f0; height:100vh; overflow:hidden; display:flex; }
    
    /* Sidebar */
    .sidebar { width:280px; background:#181c28; border-right:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; padding:14px; flex-shrink:0; }
    .sidebar-header h2 { font-size:16px; font-weight:700; color:#4f86f7; padding:4px 0 12px; }
    .new-chat-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#fff; padding:10px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:500; display:flex; align-items:center; justify-content:center; gap:8px; transition:0.2s; }
    .new-chat-btn:hover { background:rgba(255,255,255,0.1); }

    .fs-header { font-size:11px; font-weight:700; color:#5a6e8c; text-transform:uppercase; letter-spacing:0.5px; margin-top:20px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.06); }
    .fs-tree { flex:1; overflow-y:auto; margin-top:8px; font-family:Consolas, monospace; font-size:12px; display:flex; flex-direction:column; gap:2px; }
    .fs-item { padding:6px 8px; border-radius:6px; color:#a0aec0; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:0.15s; }
    .fs-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
    .fs-item .del-btn { color:#ef4444; opacity:0; font-weight:bold; font-size:13px; padding:0 4px; }
    .fs-item:hover .del-btn { opacity:1; }

    /* Main Area */
    .main-content { flex:1; display:flex; flex-direction:column; height:100vh; background:#0f121a; position:relative; }
    .top-bar { height:56px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(0,0,0,0.2); }
    
    .model-selector-wrapper { position:relative; }
    .model-selector-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); padding:6px 14px; border-radius:8px; color:#fff; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .model-dropdown { position:absolute; top:calc(100% + 6px); left:0; width:220px; background:#181c28; border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:6px; box-shadow:0 10px 25px rgba(0,0,0,0.5); display:none; flex-direction:column; gap:2px; z-index:50; }
    .model-dropdown.open { display:flex; }
    .model-option { padding:8px 10px; border-radius:8px; cursor:pointer; }
    .model-option:hover { background:rgba(255,255,255,0.06); }
    .model-option.selected { background:rgba(79,134,247,0.15); border:1px solid rgba(79,134,247,0.3); color:#4f86f7; }

    .top-actions { display:flex; gap:8px; }
    .icon-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#8a9bb5; font-size:13px; cursor:pointer; padding:6px 12px; border-radius:8px; display:flex; align-items:center; gap:6px; transition:0.2s; }
    .icon-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
    .icon-btn.primary { background:#4f86f7; color:#fff; border-color:#4f86f7; }
    .icon-btn.primary:hover { background:#3b73e3; }

    /* Messages Area */
    .messages-container { flex:1; overflow-y:auto; padding:20px 0; display:flex; flex-direction:column; align-items:center; }
    .messages-inner { width:100%; max-width:820px; padding:0 20px; display:flex; flex-direction:column; gap:20px; }
    
    .msg-group { display:flex; flex-direction:column; gap:6px; }
    .msg-author { font-size:12px; font-weight:600; color:#5a6e8c; }
    .msg-bubble { font-size:14px; line-height:1.6; word-break:break-word; white-space:pre-wrap; }
    .msg-group.user .msg-bubble { background:rgba(79,134,247,0.12); border:1px solid rgba(79,134,247,0.2); padding:12px 16px; border-radius:12px; color:#f0f3ff; align-self:flex-end; max-width:85%; }
    .msg-group.assistant .msg-bubble { color:#e2e8f0; max-width:100%; }

    .msg-img-preview { max-width:280px; max-height:200px; border-radius:8px; margin-top:6px; border:1px solid rgba(255,255,255,0.1); }
    .fs-log { background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.2); color:#6ee7b7; padding:8px 12px; border-radius:8px; font-size:12px; font-family:Consolas, monospace; margin-top:8px; display:flex; flex-direction:column; gap:4px; }

    /* Input Dock */
    .input-dock { padding:12px 20px 20px; display:flex; justify-content:center; background:linear-gradient(to top, #0f121a 80%, transparent); }
    .input-wrapper { width:100%; max-width:820px; background:#181c28; border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    
    .attachments-preview { display:flex; gap:8px; flex-wrap:wrap; display:none; }
    .attachments-preview.active { display:flex; }
    .attachment-badge { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:4px 8px; font-size:12px; color:#8a9bb5; display:flex; align-items:center; gap:6px; }
    .attachment-badge img { width:28px; height:28px; object-fit:cover; border-radius:4px; }
    .attachment-remove { cursor:pointer; color:#ef4444; font-weight:bold; font-size:14px; margin-left:4px; }

    .input-row { display:flex; align-items:flex-end; gap:10px; }
    .input-wrapper textarea { flex:1; background:none; border:none; color:#fff; font-size:14px; resize:none; outline:none; min-height:24px; max-height:160px; line-height:1.5; }
    
    .attach-btn, .send-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); width:36px; height:36px; border-radius:10px; color:#8a9bb5; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:0.15s; }
    .attach-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
    .send-btn { background:#4f86f7; border:none; color:#fff; }
    .send-btn:hover { background:#3b73e3; }

    /* Modal Settings */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; }
    .modal-overlay.open { display:flex; }
    .modal { background:#181c28; border-radius:16px; padding:24px; width:90%; max-width:440px; border:1px solid rgba(255,255,255,0.08); }
    .modal h3 { font-size:16px; margin-bottom:12px; color:#fff; }
    .modal label { font-size:12px; color:#8a9bb5; display:block; margin-top:12px; margin-bottom:4px; }
    .modal input { width:100%; padding:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:8px; color:#fff; outline:none; font-size:13px; }
    .modal-actions { display:flex; gap:8px; margin-top:20px; }
    .modal-actions button { flex:1; padding:10px; border:none; border-radius:8px; cursor:pointer; font-weight:500; }
    .modal-actions .save-btn { background:#4f86f7; color:#fff; }
    .modal-actions .cancel-btn { background:rgba(255,255,255,0.05); color:#8a9bb5; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🛠 PPG Mod Studio</h2>
    </div>
    <button class="new-chat-btn" id="newChatBtn"><span>+</span> Новый чат</button>
    
    <div class="fs-header">Файлы мода</div>
    <div class="fs-tree" id="fsTree"></div>
  </div>

  <!-- Main Area -->
  <div class="main-content">
    <div class="top-bar">
      <div class="model-selector-wrapper">
        <button class="model-selector-btn" id="modelSelectBtn">
          <span id="currentModelLabel">gemini-2.5-flash</span> ▾
        </button>
        <div class="model-dropdown" id="modelDropdown">
          <div class="model-option selected" data-model="gemini-2.5-flash" data-title="gemini-2.5-flash">
            <strong>gemini-2.5-flash</strong>
          </div>
          <div class="model-option" data-model="gemini-2.5-pro" data-title="gemini-2.5-pro">
            <strong>gemini-2.5-pro</strong>
          </div>
          <div class="model-option" data-model="custom" data-title="Кастомная модель">
            <strong>Кастомная модель</strong>
          </div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn primary" id="zipBtn">📦 Скачать мод (.zip)</button>
        <button class="icon-btn" id="settingsBtn">⚙ Настройки</button>
      </div>
    </div>

    <div class="messages-container">
      <div class="messages-inner" id="messages"></div>
    </div>

    <div class="input-dock">
      <div class="input-wrapper">
        <div class="attachments-preview" id="attachmentsPreview"></div>
        <div class="input-row">
          <button class="attach-btn" id="attachFileBtn">📎</button>
          <input type="file" id="fileInput" style="display:none;" />
          <textarea id="inputBox" placeholder="Опишите механику/скрипт мода для People Playground..."></textarea>
          <button class="send-btn" id="sendBtn">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Settings -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>⚙ Настройки API & Прокси</h3>
      <label>API Key</label>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy... или sk-..." />
      
      <label>Base URL (пусто для оригинального Google Gemini)</label>
      <input type="text" id="baseUrlInput" placeholder="https://openrouter.ai/api/v1" />
      
      <label>ID кастомной модели (если выбрана "Кастомная модель")</label>
      <input type="text" id="customModelInput" placeholder="google/gemini-2.0-flash-exp:free" />

      <div class="modal-actions">
        <button class="cancel-btn" id="closeModalBtn">Отмена</button>
        <button class="save-btn" id="saveSettingsBtn">Сохранить</button>
      </div>
    </div>
  </div>

<script>
(function() {
  const messagesEl = document.getElementById('messages');
  const inputBox = document.getElementById('inputBox');
  const sendBtn = document.getElementById('sendBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const baseUrlInput = document.getElementById('baseUrlInput');
  const customModelInput = document.getElementById('customModelInput');
  const zipBtn = document.getElementById('zipBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const fsTree = document.getElementById('fsTree');

  const modelSelectBtn = document.getElementById('modelSelectBtn');
  const modelDropdown = document.getElementById('modelDropdown');
  const currentModelLabel = document.getElementById('currentModelLabel');

  const fileInput = document.getElementById('fileInput');
  const attachFileBtn = document.getElementById('attachFileBtn');
  const attachmentsPreview = document.getElementById('attachmentsPreview');

  let apiKey = localStorage.getItem('app_api_key') || '';
  let baseUrl = localStorage.getItem('app_base_url') || '';
  let selectedModel = localStorage.getItem('app_model') || 'gemini-2.5-flash';
  let customModel = localStorage.getItem('app_custom_model') || '';

  let messages = JSON.parse(localStorage.getItem('app_messages') || '[]');
  let fs = JSON.parse(localStorage.getItem('app_fs') || '{}');
  let isWaiting = false;
  let activeAttachment = null;

  const systemInstruction = `Ты — эксперт C# разработчик модов для игры People Playground (PPG).
Твоя задача — создавать рабочий код C# скриптов и манифест mod.json.

Правила использования VFS блоков:
Когда тебе нужно создать или обновить файл, используй строго VFS блоки формата:

\`\`\`vfs
WRITE /mod.json
{
  "Name": "My Mod",
  "Author": "User",
  "Description": "Mod description",
  "ModVersion": "1.0",
  "GameVersion": "1.26+",
  "EntryPoint": "Mod.Main"
}
\`\`\`

\`\`\`vfs
WRITE /Main.cs
using UnityEngine;

namespace Mod
{
    public class Main
    {
        public static void Main()
        {
            // Initializing
        }
    }
}
\`\`\`

Или для удаления:
\`\`\`vfs
DELETE /UnusedScript.cs
\`\`\`

Всегда пиши полный, готовый к скомпилированию C# код без сокращений и без лишней 'воды' во внешнем тексте.`;

  function saveFs() {
    localStorage.setItem('app_fs', JSON.stringify(fs));
    renderFsTree();
  }

  function saveMessages() {
    localStorage.setItem('app_messages', JSON.stringify(messages));
  }

  function getFlatFiles(obj, path = '') {
    let res = [];
    for (let k in obj) {
      let p = path ? `${path}/${k}` : k;
      if (typeof obj[k] === 'string') res.push({ path: '/' + p, content: obj[k] });
      else res.push(...getFlatFiles(obj[k], p));
    }
    return res;
  }

  function setFile(path, content) {
    let parts = path.replace(/^\/+/, '').split('/');
    let curr = fs;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!curr[parts[i]] || typeof curr[parts[i]] !== 'object') curr[parts[i]] = {};
      curr = curr[parts[i]];
    }
    curr[parts[parts.length - 1]] = content;
    saveFs();
  }

  function deleteFile(path) {
    let parts = path.replace(/^\/+/, '').split('/');
    let curr = fs;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!curr[parts[i]]) return;
      curr = curr[parts[i]];
    }
    delete curr[parts[parts.length - 1]];
    saveFs();
  }

  function renderFsTree() {
    const files = getFlatFiles(fs);
    fsTree.innerHTML = '';
    if (!files.length) {
      fsTree.innerHTML = '<div style="color:#5a6e8c;padding:4px;font-size:12px;">(нет файлов)</div>';
      return;
    }
    files.forEach(f => {
      const el = document.createElement('div');
      el.className = 'fs-item';
      const ext = f.path.endsWith('.cs') ? '📜' : (f.path.endsWith('.json') ? '⚙️' : '📄');
      el.innerHTML = `<span>${ext} ${f.path}</span><span class="del-btn" title="Удалить">✕</span>`;
      el.querySelector('.del-btn').onclick = (e) => {
        e.stopPropagation();
        deleteFile(f.path);
      };
      fsTree.appendChild(el);
    });
  }

  function parseVFSCommands(text) {
    const regex = /```vfs\s*\n([\s\S]*?)\n```/g;
    let match;
    const logs = [];

    while ((match = regex.exec(text)) !== null) {
      const block = match[1].trim();
      const lines = block.split('\n');
      const cmd = lines[0].trim();

      if (cmd.startsWith('WRITE ')) {
        const path = cmd.replace('WRITE ', '').trim();
        const content = lines.slice(1).join('\n');
        setFile(path, content);
        logs.push(`⚙️ Сохранен файл: ${path}`);
      } else if (cmd.startsWith('DELETE ')) {
        const path = cmd.replace('DELETE ', '').trim();
        deleteFile(path);
        logs.push(`🗑 Удален файл: ${path}`);
      }
    }
    return { cleanText: text.replace(regex, '').trim(), logs };
  }

  function renderMessages() {
    messagesEl.innerHTML = '';
    messages.forEach(m => {
      const grp = document.createElement('div');
      grp.className = `msg-group ${m.role}`;
      
      const auth = document.createElement('div');
      auth.className = 'msg-author';
      auth.textContent = m.role === 'user' ? 'Вы' : 'PPG Assistant';
      grp.appendChild(auth);

      if (m.image) {
        const img = document.createElement('img');
        img.src = m.image;
        img.className = 'msg-img-preview';
        grp.appendChild(img);
      }

      if (m.content) {
        const bub = document.createElement('div');
        bub.className = 'msg-bubble';
        bub.textContent = m.content;
        grp.appendChild(bub);
      }

      if (m.logs && m.logs.length) {
        const lBox = document.createElement('div');
        lBox.className = 'fs-log';
        m.logs.forEach(l => {
          const d = document.createElement('div');
          d.textContent = l;
          lBox.appendChild(d);
        });
        grp.appendChild(lBox);
      }

      messagesEl.appendChild(grp);
    });
    messagesEl.parentElement.scrollTop = messagesEl.parentElement.scrollHeight;
  }

  function addMessage(role, content, logs = [], image = null) {
    messages.push({ role, content, logs, image });
    saveMessages();
    renderMessages();
  }

  async function handleSend() {
    const text = inputBox.value.trim();
    if ((!text && !activeAttachment) || isWaiting) return;

    if (!apiKey) {
      alert('Укажите API Key в настройках!');
      modalOverlay.classList.add('open');
      return;
    }

    let imgData = activeAttachment?.type === 'image' ? activeAttachment : null;
    let fullPrompt = text;
    if (activeAttachment?.type === 'text') {
      fullPrompt += `\n\n[Файл ${activeAttachment.name}]:\n${activeAttachment.content}`;
    }

    activeAttachment = null;
    attachmentsPreview.classList.remove('active');
    attachmentsPreview.innerHTML = '';

    inputBox.value = '';
    inputBox.style.height = 'auto';

    addMessage('user', text, [], imgData?.dataUrl || null);

    isWaiting = true;

    try {
      const files = getFlatFiles(fs);
      const fsContext = `[Текущие файлы проекта мода]:\n` + (files.map(f => `${f.path}`).join('\n') || '(пусто)');
      
      const targetModel = (selectedModel === 'custom') ? customModel : selectedModel;
      if (!targetModel) {
        throw new Error("Укажите название модели для 'Кастомная модель' в настройках.");
      }

      let rawAnswer = '';
      const isCustomProxy = baseUrl.trim() !== '' && !baseUrl.includes('generativelanguage.googleapis.com');

      if (!isCustomProxy) {
        // Запрос к оригинальному Google Gemini API
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`;
        
        const contents = messages.filter(m => m.role !== 'system').map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content || ' ' }]
        }));

        const currentParts = [{ text: `${fsContext}\n\nЗадача: ${fullPrompt}` }];
        if (imgData) {
          currentParts.unshift({
            inlineData: { mimeType: imgData.mimeType, data: imgData.base64 }
          });
        }

        contents[contents.length - 1].parts = currentParts;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || `Ошибка HTTP ${res.status}`);
        }

        const data = await res.json();
        rawAnswer = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      } else {
        // Запрос к стороннему прокси / OpenRouter / OpenAI API
        const endpoint = baseUrl.replace(/\/+$/, '') + '/chat/completions';
        
        const formattedMsgs = [
          { role: 'system', content: `${systemInstruction}\n\n${fsContext}` },
          ...messages.filter(m => m.role !== 'system').map(m => ({
            role: m.role,
            content: m.content || ''
          }))
        ];

        // Добавляем к последнему сообщению текст
        formattedMsgs[formattedMsgs.length - 1].content = `${fsContext}\n\nЗадача: ${fullPrompt}`;

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: targetModel,
            messages: formattedMsgs
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || `Ошибка HTTP ${res.status}`);
        }

        const data = await res.json();
        rawAnswer = data.choices?.[0]?.message?.content || '';
      }

      const { cleanText, logs } = parseVFSCommands(rawAnswer);
      addMessage('assistant', cleanText || 'Готово.', logs);

    } catch (e) {
      addMessage('assistant', `❌ Ошибка: ${e.message}`);
    } finally {
      isWaiting = false;
    }
  }

  // Прикрепление файлов
  attachFileBtn.onclick = () => fileInput.click();
  fileInput.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = ev => {
        activeAttachment = {
          type: 'image',
          mimeType: file.type,
          dataUrl: ev.target.result,
          base64: ev.target.result.split(',')[1]
        };
        showAttachmentUI(file.name, ev.target.result, true);
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = ev => {
        activeAttachment = { type: 'text', name: file.name, content: ev.target.result };
        showAttachmentUI(file.name, null, false);
      };
      reader.readAsText(file);
    }
  };

  function showAttachmentUI(name, src, isImg) {
    attachmentsPreview.classList.add('active');
    attachmentsPreview.innerHTML = `
      <div class="attachment-badge">
        ${isImg ? `<img src="${src}">` : '📄'} <span>${name}</span>
        <span class="attachment-remove" id="removeAttach">✕</span>
      </div>
    `;
    document.getElementById('removeAttach').onclick = () => {
      activeAttachment = null;
      attachmentsPreview.classList.remove('active');
      attachmentsPreview.innerHTML = '';
    };
  }

  function updateModelUI() {
    document.querySelectorAll('.model-option').forEach(opt => {
      const isSel = opt.dataset.model === selectedModel;
      opt.classList.toggle('selected', isSel);
      if (isSel) {
        currentModelLabel.textContent = (selectedModel === 'custom' && customModel) ? customModel : opt.dataset.title;
      }
    });
  }

  function init() {
    apiKeyInput.value = apiKey;
    baseUrlInput.value = baseUrl;
    customModelInput.value = customModel;

    updateModelUI();
    renderFsTree();
    renderMessages();

    sendBtn.onclick = handleSend;
    inputBox.onkeydown = e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    };

    modelSelectBtn.onclick = () => modelDropdown.classList.toggle('open');
    modelDropdown.onclick = e => {
      const opt = e.target.closest('.model-option');
      if (!opt) return;
      selectedModel = opt.dataset.model;
      localStorage.setItem('app_model', selectedModel);
      updateModelUI();
      modelDropdown.classList.remove('open');
    };

    settingsBtn.onclick = () => modalOverlay.classList.add('open');
    closeModalBtn.onclick = () => modalOverlay.classList.remove('open');
    saveSettingsBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      baseUrl = baseUrlInput.value.trim();
      customModel = customModelInput.value.trim();

      localStorage.setItem('app_api_key', apiKey);
      localStorage.setItem('app_base_url', baseUrl);
      localStorage.setItem('app_custom_model', customModel);

      updateModelUI();
      modalOverlay.classList.remove('open');
    };

    newChatBtn.onclick = () => {
      if (confirm('Очистить историю диалога?')) {
        messages = [];
        saveMessages();
        renderMessages();
      }
    };

    zipBtn.onclick = async () => {
      const files = getFlatFiles(fs);
      if (!files.length) return alert('Список файлов мода пуст');
      const zip = new JSZip();
      files.forEach(f => zip.file(f.path.replace(/^\//, ''), f.content));
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'PPG_Mod.zip';
      a.click();
    };
  }

  init();
})();
</script>
</body>
</html>
